        excludeTestsMatching "org.leralix.tan.utils.gameplay.*"
        excludeTestsMatching "org.leralix.tan.integration.*"
    }

    finalizedBy jacocoTestReport
}

jacocoTestReport {
    dependsOn test
    reports {
        xml.required = true
        html.required = true
        csv.required = false
    }

    afterEvaluate {
        classDirectories.setFrom(files(classDirectories.files.collect {
            fileTree(dir: it, exclude: [
                '**/deprecated/**',
                '**/legacy/**',
                '**/TownsAndNations.class',
                '**/gui/**',
                '**/lang/**'
            ])
        }))
    }
}

jacocoTestCoverageVerification {
    violationRules {
        rule {
            limit {
                // Progressive coverage improvement roadmap:
                // Phase 1 (Completed): 14% → 20% - Baseline with critical tests
                // Phase 2 (Completed): 20% → 50% - Epic 7: Commands, Listeners, Integration tests
                // Phase 3: 50% → 70% - GUI tests, edge cases, advanced scenarios
                // Phase 4: 70% → 85% - Legacy code coverage, deprecated code handling
                // Phase 5: 85%+ - Full coverage including all corner cases
                minimum = 0.50  // Updated: Epic 7 complete - 50% coverage achieved
            }
        }
    }
}

// Enable coverage verification - tests must pass coverage gate
check.dependsOn jacocoTestCoverageVerification
