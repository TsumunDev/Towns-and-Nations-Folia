        includeTestsMatching "org.leralix.tan.gui.BasicGuiTest"
        includeTestsMatching "org.leralix.tan.gui.admin.AdminMainMenuTest"
        includeTestsMatching "org.leralix.tan.gui.user.MainMenuTest"
        includeTestsMatching "org.leralix.tan.gui.user.player.PlayerMenuTest"

        // Exclude tests that still require full plugin setup
        excludeTestsMatching "org.leralix.tan.api.external.*"
