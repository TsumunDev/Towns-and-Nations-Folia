plugins {
    id 'java-library'
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

repositories {
    mavenCentral()
    mavenLocal()
    maven {
        name = 'folia'
        url = 'https://repo.papermc.io/repository/maven-public/'
    }
    maven {
        url = 'https://jitpack.io'
    }
}

dependencies {
    compileOnly 'org.jetbrains:annotations:24.0.0'
    // Updated to latest available Folia API (PRD Epic 1, Story 1.1)
    // Note: 1.21.1 not yet available, using 1.20.1-R0.1-SNAPSHOT for now
    // TODO: Update to 1.21.1+ when available in Maven repositories
    compileOnly 'dev.folia:folia-api:1.20.1-R0.1-SNAPSHOT'
    compileOnly 'io.github.leralix:sphere-lib:0.6.0'
}
