plugins {
    id 'java-library'
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

repositories {
    mavenCentral()
    mavenLocal()
    maven {
        name = 'folia'
        url = 'https://repo.papermc.io/repository/maven-public/'
    }
    maven {
        url = 'https://jitpack.io'
    }
}

dependencies {
    compileOnly 'org.jetbrains:annotations:24.0.0'
    // FOLIA 1.21.1+ UPGRADE (2025-02-24)
    // Note: Folia is based on Paper, so we use io.papermc.paper:paper-api
    // Folia compatibility: https://github.com/PaperMC/Folia
    // API changes documented at: https://jd.papermc.io/folia/1.21.11/
    // The paper-api is compatible with Folia as Folia extends Paper
    compileOnly 'io.papermc.paper:paper-api:1.21.1-R0.1-SNAPSHOT'
    compileOnly 'io.github.leralix:sphere-lib:0.6.0'
}
